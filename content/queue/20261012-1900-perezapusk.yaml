caption: 'Давно тут не было слышно 🙂


  Перезапускаю блог, а значит пора познакомиться заново.


  Я Сергей, больше 10 лет в маркетинге — B2B и B2C. Сейчас руковожу отделом маркетинга в AM.TECH: мы производим
  промышленные 3D-принтеры. Да, маркетинг для заводов существует, и это совсем не про «красивые картинки
  в соцсетях».


  О чём здесь будет:

  — что на самом деле скрывается за словом «маркетинг»

  — как я использую ИИ в работе

  — как продавать сложный продукт, когда сделка длится месяцами

  — и немного жизни: путешествия, спорт и мой питбуль Арчи, ему год


  Задумался, что лучший способ разобраться в теме — начать о ней рассказывать. Так что погнали.


  А вы что первым представляете, когда слышите слово «маркетинг»?'
