caption: 'Привет! Это мой канал 👋


  Я Сергей, больше 10 лет в маркетинге — B2B и B2C. Сейчас руковожу отделом маркетинга в AM.TECH: мы производим
  промышленные 3D-принтеры. Да, маркетинг для заводов существует, и он совсем не про «красивые картинки
  в соцсетях».


  Зачем этот канал? Задумался: лучший способ разобраться в теме — начать о ней рассказывать. Вот и начинаю.


  Здесь буду разбирать то, с чем сталкиваюсь в работе каждый день, без теории ради теории:


  *Что на самом деле скрывается за словом «маркетинг»* — и почему это не только SMM

  *ИИ в работе маркетолога* — что уже можно отдать нейросетям, а что нет

  *Маркетинг сложного продукта* — когда сделка длится месяцами, а покупатель — инженер

  *Цифры* — бюджеты, аналитика, прогнозы


  Посты с карточками и схемами — здесь. Живое, закулисье и моего питбуля Арчи — в Instagram @ilyushin_s.


  Какая тема ближе? Напиши в комментариях. С неё и начну)'
