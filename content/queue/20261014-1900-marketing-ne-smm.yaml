slides:
- title: Маркетинг — это не только SMM
  body: Чем на самом деле занимается маркетолог. Листай →
- title: 1. Понимает, кто покупатель
  body: 'Не «все от 18 до 65», а конкретные люди: кто принимает решение, кто на него влияет, чего боится
    и что для него важно.'
- title: 2. Считает деньги
  body: Бюджет, стоимость заявки, окупаемость. Маркетинг без цифр — это хобби за счёт компании.
- title: 3. Строит путь клиента
  body: От первого касания до сделки и повторной покупки. В B2B этот путь может длиться месяцами.
- title: 4. Работает с продуктом и ценой
  body: Кому продаём, за сколько и чем отличаемся от конкурентов. Это тоже маркетинг, а не только отдел
    продаж.
- title: 5. Анализирует и прогнозирует
  body: Что сработало, что нет и что будет дальше. Именно таких людей рынку сейчас не хватает.
- title: А где здесь SMM?
  body: 'Это один из каналов. Важный, но только часть большой картины.


    Отправь коллеге, который думает, что маркетинг — это SMM.'
