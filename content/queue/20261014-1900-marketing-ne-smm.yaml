topic: 'Маркетинг — это не только SMM: 5 задач маркетолога'
hook: «А, ведёте соцсети?»
scheduled_at: '2026-10-14T19:00:00+03:00'
caption: 'Когда я говорю, что работаю в маркетинге, мне часто отвечают: «А, ведёте соцсети?» 🙂


  Соцсети — лишь один из инструментов. Остальная работа — понять, кто вообще покупает твой продукт, сколько
  можно потратить на его продвижение и почему клиент выбирает тебя, а не конкурента.


  Разложил на карточках 5 задач маркетолога:


  1. *Понимает, кто покупатель.* В B2B решение принимает не один человек: директор решает, инженер влияет
  на выбор, закупки согласуют условия.

  2. *Считает деньги.* Бюджет → заявки → сделки → окупаемость. Без цифр маркетинг превращается в хобби
  за счёт компании.

  3. *Строит путь клиента.* От первого касания до повторной покупки — в B2B это месяцы.

  4. *Работает с продуктом и ценой.* Кому продаём, за сколько и чем отличаемся от конкурентов.

  5. *Анализирует и прогнозирует.* Что сработало и что будет дальше — таких людей рынку сейчас особенно
  не хватает.


  SMM в этой картине — один из каналов. Важный, но лишь часть большой картины.


  Перешли тому, кто до сих пор думает, что маркетинг — это SMM 😄


  А у вас в компании маркетинг — это кто?'
