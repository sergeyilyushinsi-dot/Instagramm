topic: 'Маркетинг — это не только SMM: 5 задач маркетолога'
hook: «А, ведёте соцсети?»
scheduled_at: '2026-10-14T19:00:00+03:00'
caption: 'Когда я говорю, что работаю в маркетинге, мне часто отвечают: «А, ведёте соцсети?» 🙂


  Соцсети — лишь один из инструментов. Остальная работа — понять, кто вообще покупает твой продукт, сколько
  можно потратить на его продвижение и почему клиент выбирает тебя, а не конкурента.


  В карусели — 5 вещей, которыми на самом деле занимается маркетолог.


  Сохрани, если пригодится объяснять это родственникам на праздниках 😄


  А у вас в компании маркетинг — это кто?'
