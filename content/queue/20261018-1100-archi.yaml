caption: 'Знакомьтесь, Арчи 🐾


  Ему год, и он питбуль — порода, о которой у многих складывается мнение ещё до знакомства.


  Задумался, как часто мы делаем выводы по ярлыку: о собаках, о людях, о профессиях. С маркетингом, кстати,
  то же самое — все уверены, что знают, что это, пока не столкнутся вблизи 🙂


  А у вас есть собака? Покажите в комментариях 👇'
