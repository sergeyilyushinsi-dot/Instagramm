caption: 'ИИ в маркетинге сейчас обсуждают все — от «заменит всех» до «бесполезная игрушка». Как обычно,
  правда где-то посередине.


  Собрал на карточках задачи, которые уже реально ускоряются с ИИ:

  — черновики текстов

  — разбор данных и отчётов

  — исследования рынка и конкурентов

  — генерация идей и гипотез


  И то, что я бы не отдавал никому: *стратегию, решения и ответственность за результат*.


  [УТОЧНИТЬ: добавь 1–2 своих примера — как ты сам используешь ИИ в работе. С личным опытом пост станет
  в разы сильнее]


  А вы уже используете ИИ в работе? Для чего?'
